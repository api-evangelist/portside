aid: portside
name: Portside
description: >-
  Portside is a cloud-based business aviation management software company
  headquartered in Cary, North Carolina, serving corporate flight departments,
  charter and managed fleets, fractional and aircraft management companies,
  business jet owners, and government and military aviation across more than 30
  countries. The Portside Platform is a suite of modular applications spanning
  scheduling and flight operations, fleet and crew optimization, a crew staffing
  marketplace, managed-aircraft customer billing, aviation reporting and
  analytics, an aircraft owner portal, a Safety Management System (SMS),
  RiskAssist flight risk assessment, and hotel and car reservations. Portside
  integrates with a wide range of business aviation systems across scheduling,
  charter marketplaces, accounting, maintenance, expense management, CRM,
  payments, trip services, fuel management, and risk/safety, but does not
  publish a public developer API or self-service developer portal; integrations
  are arranged directly with the Portside team. Portside is backed by Insight
  Partners.
